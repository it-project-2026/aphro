  <body class="bg-slate-50 dark:bg-slate-900 text-slate-800 dark:text-slate-100 font-sans antialiased selection:bg-cyan-500 selection:text-white">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // Suppress unhandled promise rejections related to Vite/WebSocket noise
      window.addEventListener('unhandledrejection', function(event) {
        if (event.reason && event.reason.message && (event.reason.message.includes('WebSocket') || event.reason.message.includes('vite'))) {
          event.preventDefault();
          return;
        }
      });

      // Filter console errors for websocket noise
      const originalError = console.error;
      console.error = (...args) => {
        if (args[0] && typeof args[0] === 'string' && (args[0].includes('websocket') || args[0].includes('vite'))) {
          return;
        }
        originalError.apply(console, args);
      };
    </script>
  </body>
